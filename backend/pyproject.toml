[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app", "tests"]
# The repo has a backend/alembic/ directory, so isort would otherwise treat the alembic
# package as first-party.
known_third_party = ["alembic"]

[tool.pytest.ini_options]
markers = ["migrations: drops the schema and runs alembic (run with -m migrations)"]
addopts = "-m 'not migrations'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:jose.*"]
